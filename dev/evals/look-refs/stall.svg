  <path d="M300 360 L980 360" stroke="#7A4A33" stroke-width="10" stroke-linecap="round"/>
  <!-- coins: amber with an ink outline and one cream highlight -->
  <g stroke="#140E1F" stroke-width="6">
    <circle cx="420" cy="430" r="44" fill="#F2A541"/>
    <circle cx="560" cy="480" r="44" fill="#F2A541"/>
    <circle cx="700" cy="420" r="44" fill="#F2A541"/>
    <circle cx="840" cy="490" r="44" fill="#F2A541"/>
    <circle cx="620" cy="550" r="44" fill="#F2A541"/>
  </g>
  <g fill="#F3E6CF">
    <ellipse cx="404" cy="414" rx="12" ry="8"/>
    <ellipse cx="544" cy="464" rx="12" ry="8"/>
    <ellipse cx="684" cy="404" rx="12" ry="8"/>
    <ellipse cx="824" cy="474" rx="12" ry="8"/>
    <ellipse cx="604" cy="534" rx="12" ry="8"/>
  </g>
  <g fill="#C8782A">
    <circle cx="420" cy="430" r="20"/>
    <circle cx="560" cy="480" r="20"/>
    <circle cx="700" cy="420" r="20"/>
    <circle cx="840" cy="490" r="20"/>
    <circle cx="620" cy="550" r="20"/>
  </g>
  <!-- the HUD, cream on the dark -->
  <g fill="#F3E6CF" font-family="Georgia, serif">
    <text x="40" y="660" font-size="30" letter-spacing="4">ROUND 1</text>
    <text x="1240" y="660" font-size="44" text-anchor="end">12</text>
