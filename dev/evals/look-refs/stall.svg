  </defs>
  <rect width="1280" height="720" fill="#2A1E3D"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- the string the lanterns hang on -->
  <path d="M0 70 Q320 130 640 80 T1280 70" fill="none" stroke="#140E1F" stroke-width="6"/>
  <g stroke="#140E1F" stroke-width="6">
    <circle cx="200" cy="150" r="90" fill="url(#lamp)" stroke="none"/>
    <ellipse cx="200" cy="150" rx="42" ry="52" fill="#D9472B"/>
    <path d="M178 104 h44 M178 196 h44" stroke-linecap="round"/>
    <ellipse cx="188" cy="138" rx="10" ry="18" fill="#F2A541" stroke="none"/>
    <circle cx="640" cy="130" r="90" fill="url(#lamp)" stroke="none"/>
    <ellipse cx="640" cy="130" rx="42" ry="52" fill="#D9472B"/>
    <path d="M618 84 h44 M618 176 h44" stroke-linecap="round"/>
    <ellipse cx="628" cy="118" rx="10" ry="18" fill="#F2A541" stroke="none"/>
    <circle cx="1080" cy="150" r="90" fill="url(#lamp)" stroke="none"/>
    <ellipse cx="1080" cy="150" rx="42" ry="52" fill="#D9472B"/>
    <path d="M1058 104 h44 M1058 196 h44" stroke-linecap="round"/>
    <ellipse cx="1068" cy="138" rx="10" ry="18" fill="#F2A541" stroke="none"/>
  </g>
